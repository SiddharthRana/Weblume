name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (web, api, packages)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Enables the database-backed API e2e tests (apps/api/test/scans.e2e.test.ts).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/weblume_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter "./packages/*" run build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Create test database
        run: bash scripts/db-test-setup.sh
      - run: pnpm test
      - name: Generated files are up to date (OpenAPI, API client, design tokens)
        run: pnpm openapi:check
      - name: Build API and web
        run: pnpm --filter "./apps/*" run build
      - name: Install Playwright browser
        run: pnpm --filter @weblume/web exec playwright install --with-deps chromium
      - name: Build web for end-to-end tests (mocked Supabase URL)
        run: pnpm --filter @weblume/web run build:e2e
      - name: Web end-to-end and accessibility tests
        run: pnpm --filter @weblume/web run test:e2e
      - name: Dependency audit (high and critical)
        run: pnpm audit --prod --audit-level high

  database:
    name: Database migrations + RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Apply migrations and run RLS tests
        env:
          DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash scripts/db-verify.sh

  flutter:
    name: Flutter (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' ! -name '*.g.dart' ! -name 'app_localizations*')
      - run: flutter analyze
      - run: flutter test
      # GitHub's Ubuntu runners include the Android SDK; this verifies the Android release build compiles.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android release APK (debug-signed unless a keystore is configured)
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api.example.com
