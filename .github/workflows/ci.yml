name: CI

on:
  # Feature branches are checked through their pull request; pushing to them as well ran everything twice.
  push:
    branches: [dev, main]
  pull_request:
  # "Run workflow" on the dev branch builds the Google Play bundle (.aab) as well as the test APK.
  workflow_dispatch:
    inputs:
      play_bundle:
        description: Also build the Google Play bundle (.aab)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  # Newer pushes cancel older runs on feature branches, but never on dev or main, where a run may be
  # halfway through deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (web, api, packages)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Enables the database-backed API e2e tests (apps/api/test/scans.e2e.test.ts).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/weblume_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter "./packages/*" run build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Create test database
        run: bash scripts/db-test-setup.sh
      - run: pnpm test
      - name: Generated files are up to date (OpenAPI, API client, design tokens)
        run: pnpm openapi:check
      - name: Build API and web
        run: pnpm --filter "./apps/*" run build
      - name: Install Playwright browser
        run: pnpm --filter @weblume/web exec playwright install --with-deps chromium
      - name: Build web for end-to-end tests (mocked Supabase URL)
        run: pnpm --filter @weblume/web run build:e2e
      - name: Web end-to-end and accessibility tests
        run: pnpm --filter @weblume/web run test:e2e
      - name: Dependency audit (high and critical)
        run: pnpm audit --prod --audit-level high

  database:
    name: Database migrations + RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Apply migrations and run RLS tests
        env:
          DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash scripts/db-verify.sh

  flutter:
    name: Flutter (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' ! -name '*.g.dart' ! -name 'app_localizations*')
      - run: flutter analyze
      - run: flutter test
      # GitHub's Ubuntu runners include the Android SDK; this verifies the Android release build compiles.
      # Pushes to dev skip this: the dev app build right after it compiles the same thing.
      - if: github.ref != 'refs/heads/dev'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: apps/mobile/android/**/*.gradle*
      # GitHub's runners for private repositories have 2 CPUs and about 7 GB of memory; the project's
      # 8 GB Gradle heap (sized for laptops) makes them swap. Settings in ~/.gradle win over the project's.
      - name: Size Gradle for the runner
        if: github.ref != 'refs/heads/dev'
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError' 'org.gradle.caching=true' 'org.gradle.parallel=true' > ~/.gradle/gradle.properties
      - name: Build Android release APK (64-bit ARM only, enough to prove it compiles)
        if: github.ref != 'refs/heads/dev'
        run: flutter build apk --release --target-platform android-arm64 --dart-define=API_BASE_URL=https://api.example.com

  deploy-web:
    # `main` deploys weblu.me (environment `web`); `dev` deploys dev.weblu.me (environment `web-dev`,
    # its own Pages project and settings, hidden from search engines).
    name: Deploy website (Cloudflare Pages, ${{ github.ref == 'refs/heads/dev' && 'dev' || 'production' }})
    # Flutter isn't a dependency: the site doesn't use the app, and the app job still runs (and must pass) in parallel.
    needs: [typescript, database]
    # Skipped (not failed) until the Pages project and environment exist; see docs/deployment.md.
    if: >-
      github.event_name == 'push' && (
        (github.ref == 'refs/heads/main' && vars.DEPLOY_WEB == 'true') ||
        (github.ref == 'refs/heads/dev' && vars.DEPLOY_WEB_DEV == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/dev' && 'web-dev' || 'web' }}
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-web-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" run build
      # NEXT_PUBLIC_* values are baked into the static files at build time; all of them are public.
      - name: Build the static site
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_ANDROID_APP_LIVE: ${{ vars.ANDROID_APP_LIVE || 'false' }}
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          NEXT_PUBLIC_PADDLE_ENV: ${{ vars.PADDLE_ENV }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'production' }}
          # Dev is never indexed. Production stays hidden while the environment variable NOINDEX is
          # 'true' (set it until launch day, then delete it).
          NEXT_PUBLIC_NOINDEX: ${{ (github.ref == 'refs/heads/dev' || vars.NOINDEX == 'true') && 'true' || 'false' }}
          # Production shows a "launching soon" screen while COMING_SOON is 'true'. Dev always shows the full site.
          NEXT_PUBLIC_COMING_SOON: ${{ github.ref != 'refs/heads/dev' && vars.COMING_SOON == 'true' && 'true' || 'false' }}
          NEXT_PUBLIC_AUTH_GOOGLE_ENABLED: ${{ vars.AUTH_GOOGLE_ENABLED || 'false' }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: pnpm --filter @weblume/web build
      # Each Pages project's production deployment serves its custom domain (weblu.me or dev.weblu.me).
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || (github.ref == 'refs/heads/dev' && 'weblume-dev' || 'weblume') }}
          WRANGLER_SEND_METRICS: 'false'
        run: >-
          pnpm --filter @weblume/web exec wrangler pages deploy out
          --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"

  deploy-api:
    # `dev` deploys api-dev.weblu.me (fly.dev.toml); `main` deploys production (deploy-api-prod).
    name: Deploy API (Fly.io, dev)
    needs: [typescript, database]
    # Skipped (not failed) until the `api-dev` environment and DEPLOY_API_DEV exist; see docs/deployment.md.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.DEPLOY_API_DEV == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: api-dev
      url: https://api-dev.weblu.me
    concurrency:
      group: deploy-api-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Fly builds the image on its own builders from apps/api/Dockerfile, then replaces the machine.
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.dev.toml --remote-only --ha=false
      - name: Check the API is healthy
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://api-dev.weblu.me/ready

  deploy-api-prod:
    # `main` deploys api.weblu.me (fly.toml). Needs approval if the `api` environment has reviewers.
    name: Deploy API (Fly.io, production)
    needs: [typescript, database]
    # Skipped (not failed) until the `api` environment and DEPLOY_API exist; see docs/deployment.md.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_API == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: api
      url: https://api.weblu.me
    concurrency:
      group: deploy-api-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.toml --remote-only --ha=false
      - name: Check the API is healthy
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://api.weblu.me/ready

  build-android-dev:
    # An installable app pointed at the dev environment, on every push to `dev`. Download it from the
    # run's Artifacts. Signed with the upload key when the ANDROID_* repository secrets exist (needed
    # for Google Play and for installing updates over older builds); otherwise with a throwaway key.
    name: Build Android app (dev)
    needs: [flutter]
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reuses the dev website's public settings (API and site addresses, Supabase, Turnstile site key).
    environment: web-dev
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: apps/mobile/android/**/*.gradle*
      # GitHub's runners for private repositories have 2 CPUs and about 7 GB of memory; the project's
      # 8 GB Gradle heap (sized for laptops) makes them swap. Settings in ~/.gradle win over the project's.
      - name: Size Gradle for the runner
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError' 'org.gradle.caching=true' 'org.gradle.parallel=true' > ~/.gradle/gradle.properties
      - name: Upload key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No upload key configured: the app will be signed with a throwaway key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build
        env:
          API_URL: ${{ vars.API_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          AUTH_GOOGLE_ENABLED: ${{ vars.AUTH_GOOGLE_ENABLED || 'false' }}
          PLAY_BUNDLE: ${{ github.event_name == 'workflow_dispatch' && inputs.play_bundle }}
        run: |
          DEFINES=(
            --dart-define=API_BASE_URL="$API_URL"
            --dart-define=SITE_URL="$SITE_URL"
            --dart-define=SUPABASE_URL="$SUPABASE_URL"
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY"
            --dart-define=AUTH_GOOGLE_ENABLED="$AUTH_GOOGLE_ENABLED"
            --dart-define=SENTRY_ENVIRONMENT=dev
            --dart-define=APP_VERSION=0.1.0-dev.${{ github.run_number }}
          )
          # The run number becomes the version code, so every build can install over the previous one.
          # The test APK is 64-bit ARM only (every phone the app supports, not emulators): about a third
          # of the size of an APK for all three CPU types, and quicker to build.
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} "${DEFINES[@]}"
          # The Play bundle has every CPU type (Play sends each phone only its own), so it's built only on request.
          if [ "$PLAY_BUNDLE" = "true" ] && [ -f android/key.properties ]; then
            flutter build appbundle --release --build-number=${{ github.run_number }} "${DEFINES[@]}"
          fi
      - name: Keep the app files
        uses: actions/upload-artifact@v4
        with:
          name: weblume-dev-${{ github.run_number }}
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
