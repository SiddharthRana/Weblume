# Fly.io config for the DEV API (api-dev.weblu.me). Deploy from the repository root:
#   fly deploy --config fly.dev.toml --ha=false
# Secrets (database, Supabase, Resend, Turnstile, PSI…) are set with `fly secrets set`, never here.
app = "weblume-api-dev"
primary_region = "sin" # Singapore: Fly's closest region to India (no Mumbai region).
# Give running scans time to finish on deploys and restarts (pg-boss stops taking jobs on SIGTERM).
kill_signal = "SIGTERM"
kill_timeout = "30s"


# The Dockerfile copies the monorepo, so the build context is the repository root.
[build]
  dockerfile = "apps/api/Dockerfile"

# Non-secret settings. NODE_ENV=production and PORT=4000 come from the Dockerfile.
[env]
  LOG_LEVEL = "info"
  SUPABASE_URL = "https://rcvtksjmwzmjekpemhyg.supabase.co" # the weblume-dev project
  CORS_ORIGINS = "https://dev.weblu.me"
  PUBLIC_SITE_URL = "https://dev.weblu.me"
  BILLING_RETURN_URL = "https://dev.weblu.me/account?checkout=success"
  # Fly's proxy is one hop in front of the app (api-dev.weblu.me is DNS-only in Cloudflare).
  TRUST_PROXY_HOPS = "1"
  # The scan worker and the monitoring scheduler run in this same process.
  WORKER_ENABLED = "true"
  RATE_LIMIT_STORE = "postgres"
  # Never let the scanner fetch our own API.
  SCAN_BLOCKED_HOSTS = "api-dev.weblu.me,weblume-api-dev.fly.dev"
  EMAIL_FROM = "Weblume Dev <support@weblu.me>"
  SENTRY_ENVIRONMENT = "dev"
  # Dodo test mode. DODO_API_KEY and DODO_WEBHOOK_SECRET are Fly secrets.
  WEB_PAYMENT_PROVIDER = "dodo"
  DODO_ENV = "test"
  DODO_PRODUCT_STARTER_MONTHLY = "pdt_0NrIFjOJXGG70nt1l4OkN"
  DODO_PRODUCT_STARTER_ANNUAL = "pdt_0NrIG1pGibrBFgrlwP72y"

[http_service]
  internal_port = 4000
  force_https = true
  # Must stay running: the worker processes scans and the scheduler queues monitoring runs.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"
